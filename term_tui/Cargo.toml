[package]
name = "term_tui"
description = "Standalone ratatui frontend for the EasyTerm daemon: protocol, user interface and viewport rendering only."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
term_client = { path = "../term_client" }
term_view = { path = "../term_view" }
term_proto = { path = "../term_proto" }
term_tui_mirror = { path = "../term_tui_mirror" }
# Where a daemon announced itself (see `resolve_daemon_addr`).
term_discovery = { path = "../term_discovery" }
# Serializable DSH conversation/event data, without host networking or credentials.
term_dsh_model = { path = "../term_dsh_model" }
serde_json = "1"
async-trait = "0.1.50"
alacritty_terminal = "0.26.0"
vte = "0.15"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
ratatui = "0.29"
crossterm = "0.28"
# Wrapping the transcript by display width, not by char count: a CJK message
# must not be wrapped as if every character were half as wide as it is.
unicode-width = "0.2"
log = "0.4"
env_logger = "0.6"

[dev-dependencies]
rmp-serde = "1.3"
serde = "1"
