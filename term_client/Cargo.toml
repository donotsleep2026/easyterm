[package]
name = "term_client"
description = "UI-free protocol client for the terminal-core C/S split: talks term_proto to a term_core_server daemon. Shared base for the egui GUI and the ratatui TUI frontends."
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
async-trait = "0.1.50"
dirs = "5"
term_proto = { path = "../term_proto" }
term_discovery = { path = "../term_discovery" }
rmp-serde = "1.3"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "process", "sync", "time"] }
log = "0.4"
